[build-system]
requires = [
    "setuptools>=77",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "apple-agent-kit-python"
version = "0.2.0"
description = "Build-time tooling for preparing and publishing Core AI language models for AppleAgentKit."
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "python-dotenv>=1.1,<2.0",
    "huggingface-hub>=1.32,<2.0",
    "coreai-models @ git+https://github.com/apple/coreai-models.git@main#subdirectory=python",
]

[project.scripts]
apple-agent-kit = "appleagentkit.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
appleagentkit = [
    "resources/**/*.yaml",
    "resources/**/*.yml",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "W",
    "UP",
    "B",
]

[tool.ruff.lint.isort]
known-first-party = [
    "appleagentkit",
]